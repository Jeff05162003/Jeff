<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0081c4 0%, #4a30b0 30%, #b28bd8 50%, #ef5a91 75%, #c15b67 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .navigation {
            position: absolute;
            top: 25px;
            left: 25px;
        }
        .nav-btn {
            text-decoration: none;
            color: #444;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 22px;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        .nav-btn:hover {
            background: white;
			color: #163b7a;
            transform: translateY(-5px);
			box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        }
        .contact-container {
            width: 850px;
            max-width: 90%;
            min-height: 450px;
            display: flex;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }
        .contact-info {
            width: 40%;
            padding: 50px 35px;

            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        .contact-info h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }
        .contact-info p {
            line-height: 1.6;
            margin-bottom: 30px;
            color: #666;
        }
        .info-item {
            margin: 18px 0;
            font-size: 16px;
        }
        .info-item i {
            margin-right: 12px;
            color: #ef5a91;
        }
        .contact-form {
            width: 60%;
            padding: 45px;
            color: white;
        }
        .contact-form h2 {
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            margin-bottom: 7px;
        }
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
        }
        .input-group textarea {
            height: 100px;
            resize: none;
        }
        .send-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #c15b67;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .send-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        @media (max-width: 700px) {

            .contact-container {
                flex-direction: column;
                margin-top: 60px;
            }
            .contact-info,
            .contact-form {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="navigation">
        <a href="Home.html" class="nav-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
    </div>
    <div class="contact-container">
        <div class="contact-info">
            <h1>Contact Us</h1>
            <p>
                Have questions or feedback? We'd love to hear from you!
                Send us a message and we will get back to you.
            </p>
            <div class="info-item">
                <i class="fa-solid fa-envelope"></i>
                Email Us
            </div>
            <div class="info-item">
                <i class="fa-solid fa-phone"></i>
                Contact Support
            </div>
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                Philippines
            </div>
        </div>
        <div class="contact-form">
		<h2>Send a message</h2>
		<form>
		<div class="input-group">
		<label>Name</label>
		<input type="text" placeholder="Enter your name">
		</div>
		<div class="input-group">
		<label>Email</label>
		<input type="text" placeholder="Enter your email">
		</div>
		<div class="input-group">
		<label>Message</label>
		 <textarea placeholder="Write your message here"></textarea>
		</div>
		<button type="submit" class="send-btn">
		<i class="fa-solid fa-paper-plane"></i>
		send Message
		</button>
		</form>
		</div>
		</div>
		</body>
		</html>
