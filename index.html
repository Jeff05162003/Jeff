<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        /* RESET */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* BODY */

        html,
        body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
            linear-gradient(
                135deg,
                #008fc4 0%,
                #4aa6d8 30%,
                #b28bd8 50%,
                #ef5a91 75%,
                #f05b67 100%
            );

        }


        /* LOGIN CONTAINER */

        .login-container {

            width: 850px;

            max-width: 100%;

            min-height: 480px;

            display: flex;

            background:
            rgba(255, 255, 255, 0.92);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
            0 15px 40px
            rgba(0, 0, 0, 0.25);

        }


        /* WELCOME SIDE */

        .login-welcome {

            width: 40%;

            background:
            linear-gradient(
                135deg,
                #0081c4,
                #4a30b0,
                #ef5a91
            );

            color: white;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 40px;

        }


        .login-welcome i {

            font-size: 70px;

            margin-bottom: 20px;

            color: #FFC107;

        }


        .login-welcome h1 {

            margin-bottom: 15px;

            font-size: 32px;

        }


        .login-welcome p {

            line-height: 1.6;

            font-size: 15px;

            max-width: 300px;

        }


        /* LOGIN FORM */

        .login-form {

            width: 60%;

            padding: 55px;

            display: flex;

            flex-direction: column;

            justify-content: center;

        }


        .login-form h2 {

            text-align: center;

            margin-bottom: 10px;

            color: #333;

            font-size: 30px;

        }


        .login-form .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;

        }


        /* INPUT GROUP */

        .input-group {

            margin-bottom: 20px;

            width: 100%;

        }


        .input-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #444;

        }


        .input-box {

            position: relative;

            width: 100%;

        }


        .input-box i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
            translateY(-50%);

            color: #777;

            z-index: 2;

        }


        .input-box input {

            width: 100%;

            max-width: 100%;

            padding:
            14px 15px 14px 45px;

            border:
            1px solid #ddd;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

        }


        .input-box input:focus {

            border-color: #4a30b0;

            box-shadow:
            0 0 8px
            rgba(74, 48, 176, 0.2);

        }


        /* LOGIN BUTTON */

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
            linear-gradient(
                90deg,
                #0081c4,
                #4a30b0,
                #ef5a91
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        .login-btn:hover {

            transform:
            translateY(-2px);

            box-shadow:
            0 8px 18px
            rgba(74, 48, 176, 0.3);

        }


        /* OPTIONS */

        .option {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            color: #555;

        }


        .option label {

            display: block;

            margin-bottom: 12px;

        }


        .option input[type="checkbox"] {

            margin-right: 5px;

        }


        .option a {

            color: #4a30b0;

            text-decoration: none;

        }


        .option a:hover {

            text-decoration: underline;

        }


        /* CANCEL BUTTON */

        .cancel-btn {

            display: inline-block;

            text-align: center;

            margin-top: 20px;

            padding: 10px 20px;

            background: #f44336;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            transition: 0.3s;

        }


        .cancel-btn:hover {

            background: #d32f2f;

        }


        /* TABLET */

        @media (max-width: 700px) {

            body {

                padding: 15px;

                align-items: center;

            }


            .login-container {

                width: 100%;

                max-width: 500px;

                min-height: auto;

                flex-direction: column;

                border-radius: 18px;

            }


            .login-welcome {

                width: 100%;

                padding: 45px 25px;

            }


            .login-welcome i {

                font-size: 65px;

                margin-bottom: 18px;

            }


            .login-welcome h1 {

                font-size: 30px;

            }


            .login-welcome p {

                font-size: 15px;

                max-width: 350px;

            }


            .login-form {

                width: 100%;

                padding: 40px 30px;

            }

        }


        /* PHONE */

        @media (max-width: 480px) {

            body {

                padding: 10px;

            }


            .login-container {

                width: 100%;

                max-width: 100%;

                border-radius: 15px;

            }


            .login-welcome {

                padding:
                45px 18px 40px;

            }


            .login-welcome i {

                font-size: 60px;

                margin-bottom: 18px;

            }


            .login-welcome h1 {

                font-size: 28px;

                line-height: 1.2;

            }


            .login-welcome p {

                font-size: 14px;

                line-height: 1.6;

                max-width: 100%;

            }


            .login-form {

                width: 100%;

                padding:
                35px 20px 30px;

            }


            .login-form h2 {

                font-size: 27px;

            }


            .login-form .subtitle {

                font-size: 14px;

                margin-bottom: 25px;

            }


            .input-group {

                margin-bottom: 18px;

            }


            .input-group label {

                font-size: 15px;

            }


            .input-box input {

                width: 100%;

                height: 55px;

                padding:
                12px 12px 12px 45px;

                font-size: 15px;

            }


            .login-btn {

                width: 100%;

                height: 55px;

                padding: 12px;

                font-size: 17px;

            }


            .option {

                font-size: 13px;

                line-height: 1.5;

            }

        }


        /* VERY SMALL PHONES */

        @media (max-width: 360px) {

            body {

                padding: 6px;

            }


            .login-container {

                border-radius: 12px;

            }


            .login-welcome {

                padding:
                35px 15px;

            }


            .login-welcome i {

                font-size: 52px;

            }


            .login-welcome h1 {

                font-size: 24px;

            }


            .login-welcome p {

                font-size: 13px;

            }


            .login-form {

                padding:
                30px 15px;

            }


            .login-form h2 {

                font-size: 24px;

            }


            .input-box input {

                height: 52px;

            }


            .login-btn {

                height: 52px;

            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- WELCOME -->

        <div class="login-welcome">

            <i class="fa-solid fa-helmet-safety"></i>

            <h1>
                Construction Supplies
            </h1>

            <p>
                Login to access your account and
                continue your journey with us.
            </p>

        </div>


        <!-- LOGIN FORM -->

        <div class="login-form">

            <h2>
                Welcome Back!
            </h2>


            <p class="subtitle">
                Please enter your account details
            </p>


            <form onsubmit="return validateForm()">


                <!-- USERNAME -->

                <div class="input-group">

                    <label>
                        Username
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your username"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                    </div>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>


                <!-- OPTIONS -->

                <div class="option">

                    <label>

                        <input type="checkbox">

                        Remember me

                    </label>


                    <a href="#"
                       onclick="forgotAccount(); return false;">

                        Forgot Username or Password?

                    </a>

                </div>


            </form>

        </div>

    </div>


    <script>

        function validateForm() {

            var username =
                document.getElementById("username").value;

            var password =
                document.getElementById("password").value;


            var validUsername = "Cuteko";

            var validPassword = "12345";


            if (
                username === validUsername &&
                password === validPassword
            ) {

                window.location.href =
                    "Home.html";

                return false;

            }

            else {

                alert(
                    "Invalid Username or password"
                );

                return false;

            }

        }


        function forgotAccount() {

            alert(
                "Please contact the administrator to recover your username or password."
            );

        }

    </script>


</body>

</html>
