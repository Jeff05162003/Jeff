<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
         {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
            #008fc4 0%,
			#4aa6d8 30%,
			#b28bd8 50%,
			#ef5a91 75%,
			#f05b67 100%
            );}
        .login-container {
            width: 850px;
            max-width: 90%;
            min-height: 480px;
            display: flex;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }
        .login-welcome {
            width: 40%;
            background: linear-gradient(
                135deg,
                #0081c4,
                #4a30b0,
                #ef5a91
            );
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        .login-welcome i {
            font-size: 70px;
            margin-bottom: 20px;
			color: #FFC107;
        }
        .login-welcome h1 {
            margin-bottom: 15px;
            font-size: 32px;
        }
        .login-welcome p {
            line-height: 1.6;
            font-size: 15px;
        }
        .login-form {
            width: 60%;
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-form h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
            font-size: 30px;
        }
        .login-form .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }
        .input-box {
            position: relative;
        }
        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }
        .input-box input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }
        .input-box input:focus {
            border-color: #4a30b0;
            box-shadow: 0 0 8px rgba(74, 48, 176, 0.2);
        }
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .options a {
            color: #4a30b0;
            text-decoration: none;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(
                90deg,
                #0081c4,
                #4a30b0,
                #ef5a91
            );
            color: white;
            font-size: 16px;
            font-weight: bold;	
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(74, 48, 176, 0.3);
        }
        .cancel-btn {
            display: inline-block;
            text-align: center;
            margin-top: 20px;
            padding: 10px 20px;
            background: #f44336;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .cancel-btn:hover {
            background: #d32f2f;
        }
        @media (max-width: 700px) {
            .login-container {
                flex-direction: column;
            }
            .login-welcome,
            .login-form {
                width: 100%;
            }
            .login-welcome {
                padding: 35px;
            }
            .login-form {
                padding: 35px;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
<div class="login-welcome">
<i class="fa-solid fa-helmet-safety"></i>
<h1>Construction Supplies</h1>
<p>
Login to access your account and continue
your journey with us.
</p>
</div>
<div class="login-form">
<h2>Welcome Back!</h2>
<p class="subtitle">
Please enter your account details
</p>
<form onsubmit="return validateForm()">
<div class="input-group">
<label>Username</label>
<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" id="username"placeholder="Enter your username" required>
</div>
</div>
<div class="input-group">
<label>Password</label>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="password"placeholder="Enter your password" required>
</div>
</div>
<button type="submit" class="login-btn">
<i class="fa-solid fa-right-to-bracket"></i>
Login
</button>
<div class="option"><br>
<label>
<input type="checkbox">
Remember me
</label>
<br><br>
<a href="#" onclick="fogotAccount()">
Forgot Username or Password?
</a>
</div>
</form>
</div>
<script>
 function validateForm() {
    var username = document.getElementById("username").value;
    var password = document.getElementById("password").value;
    
    var validUsername = "Cuteko";
    var validPassword = "12345";
    
    if (username === validUsername && password === validPassword)
    {
        window.location.href = "Home.html";
        return false;
    }
     else {
        alert("Invalid Username or password");
        return false;
        }
    }
</script>
</body>
</html>
